<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrobear construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 90%;
    }

    .emoji {
      font-size: 60px;
      animation: bounce 1.5s infinite;
      display: inline-block;
      margin-bottom: 20px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
      animation: loading 3s infinite;
    }

    @keyframes loading {
      0% { width: 0%; }
      50% { width: 80%; }
      100% { width: 0%; }
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🚧</div>
    <h1>Site en construction</h1>
    <p>Nous préparons quelque chose de génial.<br>Revenez bientôt !</p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <footer>&copy; 2025 astrobear.fr</footer>
  </div>

  <script>
    // Petit script optionnel pour changer l’emoji toutes les 3s
    const emojis = ["🚧", "👷‍♀️", "👷‍♂️", "🔨", "🛠️"];
    const emojiEl = document.querySelector('.emoji');
    let i = 0;
    setInterval(() => {
      i = (i + 1) % emojis.length;
      emojiEl.textContent = emojis[i];
    }, 3000);
  </script>
</body>
</html>
